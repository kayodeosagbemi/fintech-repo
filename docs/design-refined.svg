<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1620 1080" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1620" height="1080" fill="#ffffff"/>
  <text x="810" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#111">Accounts Payable — Refined Architecture (local-run approximation)</text>
  <text x="810" y="56" text-anchor="middle" font-size="13" fill="#555">Reinterpretation of docs/design.png — shapes carry explicit technology labels. See PLAN_1.md §3 for full rationale/assumptions.</text>

  <!-- ===== Row 1 ===== -->
  <!-- LB -->
  <rect x="40" y="90" width="100" height="50" rx="10" fill="#e8eef7" stroke="#34507a" stroke-width="1.5"/>
  <text x="90" y="120" text-anchor="middle" font-size="13" fill="#17304f">LB</text>

  <!-- App Server -->
  <rect x="210" y="80" width="160" height="70" rx="10" fill="#e8eef7" stroke="#34507a" stroke-width="1.5"/>
  <text x="290" y="112" text-anchor="middle" font-size="13" font-weight="600" fill="#17304f">App Server</text>
  <text x="290" y="130" text-anchor="middle" font-size="11" fill="#17304f">.NET 8 Minimal API (Kestrel)</text>

  <!-- tb router -->
  <rect x="440" y="88" width="170" height="54" rx="8" fill="#eef0f3" stroke="#555" stroke-width="1.3" stroke-dasharray="3,2"/>
  <text x="525" y="109" text-anchor="middle" font-size="12" font-weight="600" fill="#222">tb — in-process router</text>
  <text x="525" y="124" text-anchor="middle" font-size="10.5" fill="#333">no separate process/queue</text>

  <!-- Validation Service -->
  <circle cx="770" cy="115" r="72" fill="#eaf7ec" stroke="#1f8a3b" stroke-width="1.6"/>
  <text x="770" y="110" text-anchor="middle" font-size="13" font-weight="600" fill="#0f5c22">Validation</text>
  <text x="770" y="126" text-anchor="middle" font-size="13" font-weight="600" fill="#0f5c22">Service</text>

  <!-- notifications queue -->
  <rect x="930" y="88" width="210" height="54" fill="#fff3cd" stroke="#9a7300" stroke-width="1.6"/>
  <text x="1035" y="106" text-anchor="middle" font-size="11.5" font-weight="700" fill="#5c4600">"notifications" queue</text>
  <text x="1035" y="120" text-anchor="middle" font-size="10" fill="#5c4600">Channel&lt;ApprovalRequested&gt;</text>
  <text x="1035" y="133" text-anchor="middle" font-size="10" fill="#5c4600">→ NotificationDispatcher</text>

  <!-- Notification Service -->
  <circle cx="1310" cy="115" r="68" fill="#eaf7ec" stroke="#1f8a3b" stroke-width="1.6"/>
  <text x="1310" y="110" text-anchor="middle" font-size="12" font-weight="600" fill="#0f5c22">Notification</text>
  <text x="1310" y="126" text-anchor="middle" font-size="12" font-weight="600" fill="#0f5c22">Service</text>

  <!-- Approver Service/UI -->
  <rect x="1460" y="80" width="140" height="70" rx="10" fill="#fde8e8" stroke="#b23a2e" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="1530" y="108" text-anchor="middle" font-size="11.5" font-weight="600" fill="#7a2018">Approver</text>
  <text x="1530" y="122" text-anchor="middle" font-size="11.5" font-weight="600" fill="#7a2018">Service/UI</text>
  <text x="1530" y="138" text-anchor="middle" font-size="9.5" fill="#7a2018">external — out of scope</text>

  <!-- ===== Row 2 ===== -->
  <!-- validated-payments queue -->
  <rect x="640" y="260" width="260" height="54" fill="#fff3cd" stroke="#9a7300" stroke-width="1.6"/>
  <text x="770" y="278" text-anchor="middle" font-size="11.5" font-weight="700" fill="#5c4600">"validated-payments" queue</text>
  <text x="770" y="292" text-anchor="middle" font-size="10" fill="#5c4600">Channel&lt;PaymentValidated&gt;</text>
  <text x="770" y="305" text-anchor="middle" font-size="10" fill="#5c4600">→ PaymentProcessor</text>

  <!-- Payment Service -->
  <circle cx="770" cy="440" r="82" fill="#eaf7ec" stroke="#1f8a3b" stroke-width="1.6"/>
  <text x="770" y="432" text-anchor="middle" font-size="13" font-weight="600" fill="#0f5c22">Payment Service</text>
  <text x="770" y="449" text-anchor="middle" font-size="10.5" fill="#0f5c22">(PaymentProcessor +</text>
  <text x="770" y="463" text-anchor="middle" font-size="10.5" fill="#0f5c22">PaymentService)</text>

  <!-- tb company prefs cylinder -->
  <g>
    <ellipse cx="450" cy="400" rx="80" ry="14" fill="#f0e6fa" stroke="#6a3fa0" stroke-width="1.5"/>
    <rect x="370" y="400" width="160" height="70" fill="#f0e6fa" stroke="none"/>
    <line x1="370" y1="400" x2="370" y2="470" stroke="#6a3fa0" stroke-width="1.5"/>
    <line x1="530" y1="400" x2="530" y2="470" stroke="#6a3fa0" stroke-width="1.5"/>
    <path d="M370,470 A80,14 0 0 0 530,470" fill="none" stroke="#6a3fa0" stroke-width="1.5"/>
    <text x="450" y="432" text-anchor="middle" font-size="11" font-weight="600" fill="#3f1f70">tb company prefs</text>
    <text x="450" y="447" text-anchor="middle" font-size="9.5" fill="#3f1f70">CompanyPreferences table</text>
  </g>

  <!-- pmt rails external -->
  <rect x="1000" y="400" width="190" height="80" rx="10" fill="#fde8e8" stroke="#b23a2e" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="1095" y="428" text-anchor="middle" font-size="12" font-weight="600" fill="#7a2018">pmt rails</text>
  <text x="1095" y="444" text-anchor="middle" font-size="10" fill="#7a2018">IPaymentRailClient</text>
  <text x="1095" y="458" text-anchor="middle" font-size="10" fill="#7a2018">SimulatedPaymentRailClient</text>
  <text x="1095" y="472" text-anchor="middle" font-size="9.5" fill="#7a2018">(fake async success/fail)</text>

  <!-- ===== Row 3 ===== -->
  <!-- pymtevt cylinder -->
  <g>
    <ellipse cx="770" cy="600" rx="90" ry="15" fill="#f0e6fa" stroke="#6a3fa0" stroke-width="1.5"/>
    <rect x="680" y="600" width="180" height="76" fill="#f0e6fa" stroke="none"/>
    <line x1="680" y1="600" x2="680" y2="676" stroke="#6a3fa0" stroke-width="1.5"/>
    <line x1="860" y1="600" x2="860" y2="676" stroke="#6a3fa0" stroke-width="1.5"/>
    <path d="M680,676 A90,15 0 0 0 860,676" fill="none" stroke="#6a3fa0" stroke-width="1.5"/>
    <text x="770" y="634" text-anchor="middle" font-size="12" font-weight="600" fill="#3f1f70">pymtevt</text>
    <text x="770" y="650" text-anchor="middle" font-size="10" fill="#3f1f70">OutboxMessage table</text>
    <text x="770" y="664" text-anchor="middle" font-size="9.5" fill="#3f1f70">(= CDC source, see §3.4)</text>
  </g>

  <!-- CDC queue -->
  <rect x="640" y="750" width="260" height="58" fill="#fff3cd" stroke="#9a7300" stroke-width="1.6"/>
  <text x="770" y="769" text-anchor="middle" font-size="11.5" font-weight="700" fill="#5c4600">"payment-events-cdc" queue</text>
  <text x="770" y="783" text-anchor="middle" font-size="10" fill="#5c4600">Channel&lt;PaymentEvent&gt;</text>
  <text x="770" y="797" text-anchor="middle" font-size="10" fill="#5c4600">→ OutboxDispatcher / CdcProjector</text>

  <!-- Pymt Queue -->
  <rect x="610" y="900" width="320" height="66" fill="#fff3cd" stroke="#9a7300" stroke-width="1.8"/>
  <text x="770" y="920" text-anchor="middle" font-size="12" font-weight="700" fill="#5c4600">"pymt-queue"</text>
  <text x="770" y="935" text-anchor="middle" font-size="10" fill="#5c4600">Channel&lt;PaymentQueued / PaymentStatusChanged&gt;</text>
  <text x="770" y="949" text-anchor="middle" font-size="10" fill="#5c4600">→ PaymentRailsDispatcher, StatementProjector</text>
  <text x="770" y="961" text-anchor="middle" font-size="9" fill="#5c4600">(fed by CdcProjector + direct Payment Service status updates)</text>

  <!-- ===== Arrows ===== -->
  <!-- LB -> App Server -->
  <line x1="140" y1="115" x2="206" y2="115" stroke="#333" stroke-width="1.6" marker-end="url(#arrow)"/>
  <!-- App Server <-> tb -->
  <line x1="372" y1="110" x2="436" y2="110" stroke="#333" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="436" y1="122" x2="372" y2="122" stroke="#333" stroke-width="1.6" marker-end="url(#arrow)"/>
  <!-- tb <-> Validation -->
  <line x1="612" y1="108" x2="696" y2="108" stroke="#333" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="696" y1="122" x2="612" y2="122" stroke="#333" stroke-width="1.6" marker-end="url(#arrow)"/>
  <!-- Validation -> notifications -> Notification Svc -> Approver -->
  <line x1="842" y1="112" x2="926" y2="112" stroke="#333" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="1140" y1="112" x2="1240" y2="113" stroke="#333" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="1378" y1="115" x2="1456" y2="115" stroke="#333" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Validation <-> validated-payments queue -->
  <line x1="762" y1="187" x2="762" y2="256" stroke="#333" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="778" y1="256" x2="778" y2="187" stroke="#333" stroke-width="1.6" marker-end="url(#arrow)"/>
  <!-- queue <-> Payment Service -->
  <line x1="762" y1="314" x2="762" y2="358" stroke="#333" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="778" y1="358" x2="778" y2="314" stroke="#333" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Payment Service <-> tb company prefs -->
  <line x1="697" y1="415" x2="536" y2="410" stroke="#333" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="536" y1="424" x2="697" y2="428" stroke="#333" stroke-width="1.6" marker-end="url(#arrow)"/>
  <!-- Payment Service <-> pmt rails -->
  <line x1="848" y1="418" x2="994" y2="425" stroke="#333" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="994" y1="440" x2="848" y2="432" stroke="#333" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Payment Service -> pymtevt -->
  <line x1="775" y1="522" x2="775" y2="596" stroke="#333" stroke-width="1.6" marker-end="url(#arrow)"/>
  <!-- pymtevt -> CDC -->
  <line x1="770" y1="676" x2="770" y2="746" stroke="#333" stroke-width="1.6" marker-end="url(#arrow)"/>
  <!-- CDC -> Pymt Queue -->
  <line x1="770" y1="808" x2="770" y2="896" stroke="#333" stroke-width="1.6" marker-end="url(#arrow)"/>
  <!-- Payment Service -> Pymt Queue direct -->
  <path d="M 852,460 C 1020,560 1010,840 930,920" fill="none" stroke="#333" stroke-width="1.4" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
  <text x="1000" y="700" font-size="10" fill="#333">Payment Service → Pymt Queue (direct status write)</text>

  <!-- Pymt Queue -> App Server (status callback / poll) -->
  <path d="M 606,920 C 120,920 60,500 60,250 C 60,180 150,150 236,146" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="40" y="560" font-size="10.5" fill="#333" transform="rotate(-90 40 560)">status poll — GET /payments/&#123;id&#125;</text>

  <!-- ===== Legend ===== -->
  <g transform="translate(40,1000)">
    <rect x="0" y="0" width="1560" height="70" rx="8" fill="#fafafa" stroke="#ccc"/>
    <text x="16" y="18" font-size="12" font-weight="700" fill="#111">Legend</text>

    <rect x="16" y="28" width="26" height="18" rx="4" fill="#e8eef7" stroke="#34507a"/>
    <text x="50" y="41" font-size="11" fill="#222">Infra / host process</text>

    <circle cx="245" cy="37" r="11" fill="#eaf7ec" stroke="#1f8a3b"/>
    <text x="264" y="41" font-size="11" fill="#222">Service (in-process, sync call)</text>

    <rect x="470" y="28" width="26" height="18" fill="#fff3cd" stroke="#9a7300"/>
    <text x="504" y="41" font-size="11" fill="#222">Queue — in-process Channel&lt;T&gt; (local approx. of a message bus)</text>

    <g transform="translate(900,28)">
      <ellipse cx="13" cy="4" rx="13" ry="4" fill="#f0e6fa" stroke="#6a3fa0"/>
      <rect x="0" y="4" width="26" height="12" fill="#f0e6fa"/>
      <path d="M0,16 A13,4 0 0 0 26,16" fill="none" stroke="#6a3fa0"/>
    </g>
    <text x="934" y="41" font-size="11" fill="#222">Data store (SQLite table)</text>

    <rect x="1130" y="28" width="26" height="18" rx="4" fill="#fde8e8" stroke="#b23a2e" stroke-dasharray="4,2"/>
    <text x="1164" y="41" font-size="11" fill="#222">External / simulated / out of scope</text>

    <text x="16" y="60" font-size="10" fill="#555">Full rationale, assumptions, and rectangle→channel mapping: PLAN_1.md §3. Diamonds from the original sketch are rendered here as routers, stores, or external systems per that mapping.</text>
  </g>
</svg>
